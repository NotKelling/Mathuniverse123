<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game | Math Universe</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background: #0f172a;
            color: #f8fafc;

            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */

        header {
            height: 64px;

            background: #111827;
            border-bottom: 1px solid #293548;

            display: flex;
            align-items: center;

            padding: 0 24px;
        }

        .back {
            color: white;
            text-decoration: none;

            background: #1e293b;

            border: 1px solid #334155;
            border-radius: 7px;

            padding: 9px 15px;

            font-size: 13px;

            transition: 0.2s;
        }

        .back:hover {
            background: #29384d;
        }

        .logo {
            margin-left: 16px;

            color: white;

            font-size: 20px;
            font-weight: bold;
        }


        /* MAIN */

        main {
            width: min(1050px, calc(100% - 30px));

            margin: auto;

            padding: 28px 0 50px;
        }


        .game-title {
            text-align: center;

            color: #f8fafc;

            font-size: 25px;
            font-weight: bold;

            margin-bottom: 20px;
        }


        /* GAME PANEL */

        .game-box {
            background: #1e293b;

            border: 1px solid #293548;

            border-radius: 10px;

            padding: 18px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }


        /* GAME SCREEN */

        .game-screen {
            position: relative;

            width: 82%;
            height: 540px;

            margin: 0 auto;

            background: #000;

            border: 1px solid #334155;

            border-radius: 7px;

            overflow: hidden;
        }


        iframe {
            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;
        }


        /* PLAY SCREEN */

        .play-screen {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #080c14;

            z-index: 5;
        }


        .play-button {
            width: 150px;
            height: 55px;

            border: none;

            border-radius: 8px;

            background: #7c5cff;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s;
        }


        .play-button:hover {
            background: #6b4de6;

            transform: scale(1.04);
        }


        .play-button:active {
            transform: scale(0.98);
        }


        /* CONTROLS */

        .controls {
            display: flex;

            justify-content: center;

            gap: 10px;

            width: 82%;

            margin: 14px auto 0;
        }


        .controls button {
            height: 43px;

            padding: 0 20px;

            border: 1px solid #334155;

            border-radius: 7px;

            background: #111827;

            color: #f8fafc;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .controls button:hover {
            background: #29384d;
        }


        /* INFO */

        .info {
            text-align: center;

            color: #64748b;

            margin-top: 18px;

            font-size: 12px;
        }


        /* FULLSCREEN */

        .game-screen:fullscreen {
            width: 100vw;
            height: 100vh;

            border: none;
            border-radius: 0;
        }


        .game-screen:fullscreen iframe {
            width: 100%;
            height: 100%;
        }


        /* TABLET */

        @media (max-width: 800px) {

            .game-screen {
                width: 92%;
                height: 500px;
            }

            .controls {
                width: 92%;
            }

        }


        /* PHONE */

        @media (max-width: 600px) {

            header {
                height: 56px;

                padding: 0 12px;
            }

            .logo {
                font-size: 17px;
            }

            main {
                width: calc(100% - 20px);

                padding-top: 20px;
            }

            .game-title {
                font-size: 21px;
            }

            .game-box {
                padding: 10px;
            }

            .game-screen {
                width: 100%;
                height: 55vh;
            }

            .controls {
                width: 100%;
            }

        }
    </style>
</head>

<body>

    <header>

        <a
            href="index.html"
            class="back"
        >
            ← Back
        </a>

        <div class="logo">
            Math Universe
        </div>

    </header>


    <main>

        <h1
            class="game-title"
            id="gameTitle"
        >
            Loading Game...
        </h1>


        <div class="game-box">

            <div
                class="game-screen"
                id="gameScreen"
            >

                <!-- GAME -->

                <iframe
                    id="gameFrame"
                    allowfullscreen
                    allow="fullscreen; autoplay"
                ></iframe>


                <!-- PLAY OVERLAY -->

                <div
                    class="play-screen"
                    id="playScreen"
                >

                    <button
                        class="play-button"
                        id="playButton"
                    >
                        ▶ PLAY
                    </button>

                </div>

            </div>


            <div class="controls">

                <button
                    onclick="fullscreenGame()"
                >
                    ⛶ FULLSCREEN
                </button>

            </div>

        </div>


        <div class="info">

            Playing
            <strong id="gameName">
                Game
            </strong>

        </div>

    </main>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const name =
            params.get("name") || "Game";


        const url =
            params.get("url");


        const title =
            document.getElementById(
                "gameTitle"
            );


        const gameName =
            document.getElementById(
                "gameName"
            );


        const frame =
            document.getElementById(
                "gameFrame"
            );


        const playScreen =
            document.getElementById(
                "playScreen"
            );


        const playButton =
            document.getElementById(
                "playButton"
            );


        const gameScreen =
            document.getElementById(
                "gameScreen"
            );


        title.textContent = name;

        gameName.textContent = name;

        document.title =
            name + " | Math Universe";


        /* PLAY */

        playButton.addEventListener(
            "click",
            () => {

                if (!url) {
                    return;
                }


                frame.src = url;


                playScreen.style.display =
                    "none";

            }
        );


        /* FULLSCREEN */

        function fullscreenGame() {

            if (
                gameScreen.requestFullscreen
            ) {

                gameScreen.requestFullscreen();

            }

        }

    </script>

</body>
</html>
